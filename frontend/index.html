<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080B14">
  <title>VERITY · Brand Integrity & Governance OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      --bg-deep: #080B14;
      --bg-surface: #0D1220;
      --bg-elevated: #131A2E;
      --glass-bg: rgba(13, 18, 32, 0.72);
      --glass-elevated: rgba(19, 26, 46, 0.75);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-hover: rgba(67, 230, 210, 0.35);
      --glass-highlight: inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
      
      --teal: #43E6D2;
      --teal-glow: rgba(67, 230, 210, 0.25);
      --teal-subtle: rgba(67, 230, 210, 0.12);
      --teal-border: rgba(67, 230, 210, 0.25);
      
      --violet: #8B7CFF;
      --violet-glow: rgba(139, 124, 255, 0.25);
      --violet-subtle: rgba(139, 124, 255, 0.12);
      
      --text-main: #F4F7FC;
      --text-muted: #98A4B8;
      --text-dim: #64748B;
      
      --coral-red: #F43F5E;
      --coral-subtle: rgba(244, 63, 94, 0.14);
      --coral-border: rgba(244, 63, 94, 0.3);
      
      --amber-warn: #F59E0B;
      --amber-subtle: rgba(245, 158, 11, 0.14);
      --amber-border: rgba(245, 158, 11, 0.3);
      
      --emerald-good: #2DD4BF;
      --emerald-subtle: rgba(45, 212, 191, 0.14);
      --emerald-border: rgba(45, 212, 191, 0.3);
      
      --blue-low: #38BDF8;
      --blue-subtle: rgba(56, 189, 248, 0.14);
      --blue-border: rgba(56, 189, 248, 0.3);

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      
      --shadow-subtle: 0 4px 20px -2px rgba(0, 0, 0, 0.4);
      --shadow-glass: 0 16px 36px -4px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.08);
      --transition-fast: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      --transition-smooth: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background-color: var(--bg-deep);
      background-image: 
        radial-gradient(circle at 18% 12%, rgba(67, 230, 210, 0.07) 0%, transparent 40%),
        radial-gradient(circle at 82% 22%, rgba(139, 124, 255, 0.09) 0%, transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(67, 230, 210, 0.04) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 48px 48px, 48px 48px;
      color: var(--text-main);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 7px; height: 7px; }
    ::-webkit-scrollbar-track { background: rgba(8, 11, 20, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.14); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(67, 230, 210, 0.4); }

    /* Interactive Elements & Typography */
    button, input, textarea, select {
      font-family: inherit;
      color: inherit;
    }
    button { cursor: pointer; border: 0; background: none; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--teal);
      outline-offset: 3px;
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .shell {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .side {
      width: 260px;
      position: fixed;
      inset: 0 auto 0 0;
      padding: 24px 16px;
      background: rgba(9, 13, 23, 0.82);
      border-right: 1px solid var(--glass-border);
      display: flex;
      flex-direction: column;
      z-index: 20;
      backdrop-filter: blur(24px) saturate(190%);
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.35);
    }
    
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 20px;
    }
    .logo-mark {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, rgba(67, 230, 210, 0.22), rgba(139, 124, 255, 0.22));
      border: 1px solid rgba(67, 230, 210, 0.4);
      display: grid;
      place-items: center;
      box-shadow: 0 0 20px rgba(67, 230, 210, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      color: var(--teal);
      flex-shrink: 0;
    }
    .logo-text b {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.12em;
      background: linear-gradient(90deg, #FFFFFF, #B9FFF5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .logo-text small {
      display: block;
      font: 9px/1 'DM Mono', monospace;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      margin-top: 5px;
    }

    .label {
      font: 9px/1 'DM Mono', monospace;
      letter-spacing: 0.16em;
      color: var(--text-dim);
      padding: 0 10px 10px;
      text-transform: uppercase;
    }

    .workspace-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.025);
      color: var(--text-main);
      width: 100%;
      text-align: left;
      margin-bottom: 24px;
      transition: var(--transition-fast);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }
    .workspace-btn:hover {
      background: rgba(67, 230, 210, 0.05);
      border-color: var(--teal-border);
    }
    .ws-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(67, 230, 210, 0.2), rgba(139, 124, 255, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--teal);
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
    }
    .workspace-btn div {
      display: grid;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }
    .workspace-btn b {
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .workspace-btn small {
      font-size: 9px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Navigation */
    .nav {
      display: grid;
      gap: 5px;
    }
    .nav button {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      background: transparent;
      color: var(--text-muted);
      width: 100%;
      text-align: left;
      font-size: 12px;
      font-weight: 500;
      transition: var(--transition-fast);
    }
    .nav button svg {
      width: 16px;
      height: 16px;
      stroke-width: 1.8;
      stroke: currentColor;
      fill: none;
      transition: var(--transition-fast);
    }
    .nav button:hover {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.05);
    }
    .nav button.active {
      background: linear-gradient(90deg, rgba(67, 230, 210, 0.12), rgba(139, 124, 255, 0.06));
      border-color: rgba(67, 230, 210, 0.3);
      color: #FFFFFF;
      box-shadow: 0 0 16px rgba(67, 230, 210, 0.12);
    }
    .nav button.active svg {
      stroke: var(--teal);
      filter: drop-shadow(0 0 6px var(--teal-glow));
    }
    .nav-tag {
      margin-left: auto;
      font: 8px/1 'DM Mono', monospace;
      padding: 3px 6px;
      border-radius: 4px;
      background: rgba(67, 230, 210, 0.15);
      border: 1px solid rgba(67, 230, 210, 0.3);
      color: var(--teal);
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 14px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--glass-border);
      font-size: 10px;
    }
    .sidebar-footer-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font: 9px 'DM Mono', monospace;
      color: var(--teal);
      letter-spacing: 0.05em;
    }
    .sidebar-footer-badge i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 8px var(--teal);
    }
    .sidebar-footer p {
      margin: 6px 0 0 0;
      color: var(--text-dim);
      font-size: 10px;
      line-height: 1.5;
    }

    /* Main Area */
    .main {
      margin-left: 260px;
      width: calc(100% - 260px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Bar */
    header {
      height: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 36px;
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      background: rgba(8, 11, 20, 0.82);
      backdrop-filter: blur(20px);
      z-index: 15;
    }
    .crumb-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .crumb-bar b {
      color: var(--text-main);
      font-weight: 600;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .engine-status-pill {
      font: 9px/1 'DM Mono', monospace;
      letter-spacing: 0.08em;
      padding: 6px 12px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--emerald-border);
      background: var(--emerald-subtle);
      color: var(--emerald-good);
    }
    .engine-status-pill.offline {
      border-color: var(--coral-border);
      background: var(--coral-subtle);
      color: var(--coral-red);
    }
    .engine-status-pill i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    /* Content Canvas */
    .content {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 36px 64px;
      flex: 1;
    }

    /* Error Banner */
    .error-banner {
      padding: 14px 18px;
      margin-bottom: 24px;
      border: 1px solid var(--coral-border);
      background: rgba(244, 63, 94, 0.08);
      backdrop-filter: blur(16px);
      color: #FFA4B4;
      border-radius: var(--radius-md);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(244, 63, 94, 0.12);
    }
    .error-banner button {
      background: rgba(255, 255, 255, 0.1);
      border: 0;
      color: #FFFFFF;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid transparent;
      transition: var(--transition-fast);
      white-space: nowrap;
      text-decoration: none;
    }
    .btn svg {
      width: 15px;
      height: 15px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #43E6D2, #2CC4B1);
      color: #080B14;
      border-color: rgba(67, 230, 210, 0.5);
      box-shadow: 0 2px 14px var(--teal-glow);
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #59edea, #35d4c1);
      box-shadow: 0 4px 22px rgba(67, 230, 210, 0.45);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.04);
      border-color: var(--glass-border);
      color: var(--text-main);
      backdrop-filter: blur(12px);
    }
    .btn-secondary:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
    }
    .btn-success {
      background: var(--emerald-subtle);
      border-color: var(--emerald-border);
      color: var(--emerald-good);
    }
    .btn-success:hover:not(:disabled) {
      background: rgba(45, 212, 191, 0.22);
      border-color: var(--emerald-good);
      transform: translateY(-1px);
    }
    .btn-danger {
      background: var(--coral-subtle);
      border-color: var(--coral-border);
      color: var(--coral-red);
    }
    .btn-danger:hover:not(:disabled) {
      background: rgba(244, 63, 94, 0.22);
      border-color: var(--coral-red);
      transform: translateY(-1px);
    }
    .btn-violet {
      background: var(--violet-subtle);
      border-color: rgba(139, 124, 255, 0.35);
      color: #C7BFFF;
    }
    .btn-violet:hover:not(:disabled) {
      background: rgba(139, 124, 255, 0.22);
      transform: translateY(-1px);
    }

    /* Glass Panels */
    .glass-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(20px) saturate(180%);
      box-shadow: var(--shadow-glass);
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    .glass-card-glow {
      position: absolute;
      top: 0;
      right: 0;
      width: 200px;
      height: 200px;
      background: radial-gradient(circle at top right, rgba(67, 230, 210, 0.08), transparent 70%);
      pointer-events: none;
    }

    /* Hero Section */
    .hero-card {
      position: relative;
      background: linear-gradient(135deg, rgba(13, 18, 32, 0.85), rgba(19, 26, 46, 0.8));
      border: 1px solid rgba(67, 230, 210, 0.2);
      border-radius: var(--radius-xl);
      padding: 40px;
      overflow: hidden;
      margin-bottom: 28px;
      box-shadow: 0 20px 48px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }
    .hero-mesh {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(circle at 85% 30%, rgba(139, 124, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 75% 70%, rgba(67, 230, 210, 0.12) 0%, transparent 40%);
      pointer-events: none;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(67, 230, 210, 0.1);
      border: 1px solid rgba(67, 230, 210, 0.25);
      color: var(--teal);
      font: 10px 'DM Mono', monospace;
      letter-spacing: 0.1em;
      margin-bottom: 16px;
    }
    .hero-title {
      font-size: clamp(28px, 3.2vw, 42px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.15;
      margin: 0 0 14px;
    }
    .hero-title span {
      background: linear-gradient(90deg, #FFFFFF 0%, #A5F3FC 50%, #C4B5FD 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .hero-desc {
      font-size: 13px;
      line-height: 1.7;
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 0 28px;
    }
    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .metric-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 20px;
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow-subtle);
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }
    .metric-card:hover {
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.45);
    }
    .metric-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .metric-icon {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--teal);
    }
    .metric-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }
    .metric-icon.violet { color: var(--violet); background: var(--violet-subtle); border-color: rgba(139, 124, 255, 0.2); }
    .metric-icon.amber { color: var(--amber-warn); background: var(--amber-subtle); border-color: var(--amber-border); }
    .metric-icon.emerald { color: var(--emerald-good); background: var(--emerald-subtle); border-color: var(--emerald-border); }
    .metric-icon.coral { color: var(--coral-red); background: var(--coral-subtle); border-color: var(--coral-border); }
    .metric-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .metric-val {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
      margin: 4px 0 8px;
    }
    .metric-sub {
      font-size: 10px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Layout Splits */
    .cols-split {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 20px;
    }
    .cols-half {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    /* Panel Headers */
    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
      gap: 12px;
    }
    .panel-head h3 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0;
      color: #FFFFFF;
    }
    .panel-head p {
      font-size: 11px;
      color: var(--text-muted);
      margin: 4px 0 0 0;
    }

    /* Status Pills */
    .pill {
      font: 9px/1 'DM Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 5px 9px;
      border-radius: 6px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .pill.good {
      color: var(--emerald-good);
      background: var(--emerald-subtle);
      border-color: var(--emerald-border);
    }
    .pill.warn {
      color: var(--amber-warn);
      background: var(--amber-subtle);
      border-color: var(--amber-border);
    }
    .pill.danger {
      color: var(--coral-red);
      background: var(--coral-subtle);
      border-color: var(--coral-border);
    }
    .pill.ready {
      color: var(--teal);
      background: var(--teal-subtle);
      border-color: var(--teal-border);
    }

    /* Severity Badges */
    .badge-severity {
      font: 9px 'DM Mono', monospace;
      padding: 3px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .badge-severity.critical, .badge-severity.high {
      background: var(--coral-subtle);
      color: var(--coral-red);
      border: 1px solid var(--coral-border);
    }
    .badge-severity.medium {
      background: var(--amber-subtle);
      color: var(--amber-warn);
      border: 1px solid var(--amber-border);
    }
    .badge-severity.low {
      background: var(--blue-subtle);
      color: var(--blue-low);
      border: 1px solid var(--blue-border);
    }

    /* List Rows */
    .list-row {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 13px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255, 255, 255, 0.03);
      background: rgba(255, 255, 255, 0.015);
      color: var(--text-main);
      text-align: left;
      margin-bottom: 8px;
      transition: var(--transition-fast);
    }
    .list-row:hover {
      background: rgba(67, 230, 210, 0.04);
      border-color: rgba(67, 230, 210, 0.2);
      transform: translateX(2px);
    }
    .list-row-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: grid;
      place-items: center;

<!-- Toast notification -->

<script>
// Configurable API base URL: window setting -> localStorage -> default port 8000
const API = window.__VERITY_API_URL__ || localStorage.getItem('VERITY_API_URL') || 'http://127.0.0.1:8000';

let page = 'Overview';
let brands = [];
let brand = '';
let rules = [];
let reviews = [];
let selected = null;
let isSubmitting = false;
let historyFilter = 'all';
let ruleKindFilter = 'all';

const $ = id => document.getElementById(id);

function esc(s) {
  return String(s ?? '')
    .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function toast(msg) {
  const t = $('toast');
  t.innerHTML = `
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#43E6D2" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
    <span>${esc(msg)}</span>
  `;
  t.hidden = false;
  setTimeout(() => { t.hidden = true; }, 3200);
}

function showError(msg) {
  const c = $('error-container');
  if (c) {
    c.innerHTML = `
      <div class="error-banner">
        <span><b>Backend API Notice:</b> ${esc(msg)}</span>
        <button onclick="clearError()" title="Dismiss">✕</button>
      </div>
    `;
  }
}

function clearError() {
  const c = $('error-container');
  if (c) c.innerHTML = '';
}

async function api(path, opts = {}) {
  clearError();
  const url = API + path;
  try {
    const res = await fetch(url, {
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    if (!res.ok) {
      let j = {};
      try { j = await res.json(); } catch {}
      let msg = j.detail;
      if (Array.isArray(msg)) {
        msg = msg.map(m => m.msg || JSON.stringify(m)).join(', ');
      }
      throw Error(msg || `Request failed: ${res.status}`);
    }
    return res.json();
  } catch (err) {
    let message = err.message;
    if (message.includes('Failed to fetch') || message.includes('NetworkError') || message.includes('fetch failed')) {
      message = `Cannot connect to backend at ${API}. Ensure uvicorn is running: "python -m uvicorn app.main:app --reload --port 8000"`;
      updateEngineStatus(false);
    }
    showError(message);
    throw Error(message);
  }
}

function updateEngineStatus(online) {
  const el = $('engine-status');
  const txt = $('engine-status-text');
  if (!el || !txt) return;
  if (online) {
    el.className = 'engine-status-pill';
    txt.textContent = 'ENGINE ONLINE';
  } else {
    el.className = 'engine-status-pill offline';
    txt.textContent = 'BACKEND OFFLINE';
  }
}

async function checkHealth() {
  try {
    const res = await fetch(API + '/health');
    updateEngineStatus(res.ok);
  } catch {
    updateEngineStatus(false);
  }
}

function go(p) {
  page = p;
  render();
}

function statusPill(s) {
  const st = s || 'needs_review';
  let cls = 'pill';
  if (st === 'approved') cls += ' good';
  else if (st === 'ready_for_approval') cls += ' ready';
  else if (st === 'changes_required') cls += ' danger';
  else if (st === 'needs_review') cls += ' warn';
  return `<span class="${cls}">${esc(st.replaceAll('_', ' '))}</span>`;
}

function severityBadge(sev) {
  const s = (sev || 'medium').toLowerCase();
  return `<span class="badge-severity ${esc(s)}">${esc(s)}</span>`;
}

function findingStatusBadge(s) {
  if (s === 'resolved') return '<span class="pill good">✓ Resolved</span>';
  if (s === 'rejected' || s === 'dismissed') return '<span class="pill">✕ Dismissed</span>';
  if (s === 'accepted') return '<span class="pill danger">⚠ Violation Accepted</span>';
  return '<span class="pill warn">● Pending Review</span>';
}

function emptyState(title, desc, action = '', fn = '') {
  return `
    <div class="empty-state">
      <div class="empty-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      </div>
      <h3>${esc(title)}</h3>
      <p>${esc(desc)}</p>
      ${action ? `<button class="btn btn-secondary" onclick="${fn}">${esc(action)}</button>` : ''}
    </div>
  `;
}

async function refresh() {
  try {
    checkHealth();
    brands = await api('/api/brands');
    if (!brand && brands.length) {
      brand = String(brands[0].id);
    }
    rules = brand ? await api(`/api/brands/${brand}/rules`) : [];
    reviews = await api('/api/reviews');
    
    const activeBrandObj = brands.find(x => String(x.id) === brand);
    if ($('wsname')) $('wsname').textContent = activeBrandObj?.name || 'Set up your brand';
    if ($('wsdesc')) $('wsdesc').textContent = brand ? `${rules.length} configured rules` : 'No brand selected';
    if ($('wsmark')) $('wsmark').textContent = (activeBrandObj?.name || 'V')[0].toUpperCase();
    render();
  } catch (e) {
    showError(e.message);
    render();
  }
}

async function switchBrand(id) {
  brand = id;
  rules = brand ? await api(`/api/brands/${brand}/rules`) : [];
  const b = brands.find(x => String(x.id) === brand);
  if ($('wsname')) $('wsname').textContent = b?.name || 'Set up your brand';
  if ($('wsdesc')) $('wsdesc').textContent = b ? `${rules.length} configured rules` : 'No brand selected';
  if ($('wsmark')) $('wsmark').textContent = (b?.name || 'V')[0].toUpperCase();
  render();
}

async function createBrand(e) {
  e.preventDefault();
  if (isSubmitting) return;
  const nameInput = $('brandname');
  const descInput = $('branddesc');
  const btn = $('createbrandbtn');
  
  try {
    isSubmitting = true;
    if (btn) btn.disabled = true;
    const b = await api('/api/brands', {
      method: 'POST',
      body: JSON.stringify({ name: nameInput.value, description: descInput.value }),
    });
    brands.push(b);
    brand = String(b.id);
    rules = [];
    toast(`Workspace '${b.name}' created`);
    switchBrand(brand);
  } catch (err) {
    // Handled in api()
  } finally {
    isSubmitting = false;
    if (btn) btn.disabled = false;
  }
}

async function addRule(e) {
  e.preventDefault();
  if (isSubmitting) return;
  if (!brand) {
    showError('Please select or create a brand workspace first.');
    return;
  }
  const btn = $('addrulebtn');
  try {
    isSubmitting = true;
    if (btn) btn.disabled = true;
    const d = {
      kind: $('kind').value,
      title: $('ruletitle').value,
      pattern: $('pattern').value,
      severity: $('severity').value,
      explanation: $('explanation').value,
      suggestion: $('suggestion').value,
      source_note: $('source').value,
    };
    const r = await api(`/api/brands/${brand}/rules`, {
      method: 'POST',
      body: JSON.stringify(d),
    });
    rules.push(r);
    toast(`Rule '${r.title}' saved`);
    render();
  } catch (err) {
    // Handled in api()
  } finally {
    isSubmitting = false;
    if (btn) btn.disabled = false;
  }
}

function updateCharCount(val) {
  const count = (val || '').length;
  const el = $('charcount');
  if (el) el.textContent = `${count.toLocaleString()} / 20,000`;
}

async function runReview(e) {
  e.preventDefault();
  if (isSubmitting) return;
  const btn = $('runreviewbtn');
  const originalText = btn.innerHTML;
  try {
    isSubmitting = true;
    btn.disabled = true;
    btn.innerHTML = `
      <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10" stroke-dasharray="32" stroke-dashoffset="10"/></svg>
      Analyzing Content…
    `;
    const r = await api('/api/reviews', {
      method: 'POST',
      body: JSON.stringify({
        brand_id: Number($('reviewbrand').value),
        title: $('reviewtitle').value || 'Untitled review',
        content: $('reviewcontent').value,
      }),
    });
    reviews.unshift(r);
    selected = r;
    toast(`Review #${r.id} complete: ${r.findings.length} findings generated`);
    render();
  } catch (err) {
    // Handled in api()
  } finally {
    isSubmitting = false;
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  }
}

async function openReview(id) {
  try {
    selected = await api(`/api/reviews/${id}`);
    go('Review Studio');
  } catch (err) {
    // Handled in api()
  }
}

async function decideFinding(findingId, decision) {
  if (!selected) return;
  let reason = '';
  
  if (decision === 'resolved') {
    const finding = selected.findings.find(f => f.id === findingId);
    if (!finding?.suggested_correction) {
      reason = prompt('This rule has no pre-configured suggested correction. Enter a resolution note explaining how the violation was remediated:');
      if (reason === null) return;
      if (!reason.trim()) {
        showError('A resolution reason is required when no automated correction is configured.');
        return;
      }
    } else {
      reason = `Applied suggested correction: "${finding.suggested_correction}"`;
    }
  } else if (decision === 'rejected') {
    const inputReason = prompt('Optional: Reason for dismissing / rejecting this finding (e.g. false positive, acceptable context):');
    if (inputReason === null) return;
    reason = inputReason.trim() || 'Dismissed by reviewer';
  } else if (decision === 'accepted') {
    reason = 'Confirmed as active policy violation requiring changes.';
  }

  try {
    selected = await api(`/api/reviews/${selected.id}/decisions`, {
      method: 'POST',
      body: JSON.stringify({ finding_id: findingId, decision, reason }),
    });
    reviews = reviews.map(r => (r.id === selected.id ? selected : r));
    toast(`Decision saved: Finding marked as ${decision}`);
    render();
  } catch (err) {
    // Handled in api()
  }
}

async function approveReview(reviewId) {
  try {
    selected = await api(`/api/reviews/${reviewId}/approve`, { method: 'POST' });
    reviews = reviews.map(r => (r.id === selected.id ? selected : r));
    toast('Review sign-off complete: Status APPROVED');
    render();
  } catch (err) {
    // Handled in api()
  }
}

function closeReportModal() {
  document.body.classList.remove('report-open');
  $('report-modal').hidden = true;
}

window.addEventListener('beforeprint', () => {
  const modal = $('report-modal');
  if (modal && !modal.hidden) {
    document.body.classList.add('report-open');
  }
});

window.addEventListener('afterprint', () => {
  const modal = $('report-modal');
  if (!modal || modal.hidden) {
    document.body.classList.remove('report-open');
  }
});

async function downloadReportJson(reviewId) {
  try {
    const report = await api(`/api/reviews/${reviewId}/report`);
    const blob = new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' });
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = u;
    a.download = `verity-compliance-report-review-${reviewId}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(u);
    toast('Compliance JSON exported');
  } catch (err) {
    // Handled in api()
  }
}

function setHistoryFilter(flt) {
  historyFilter = flt;
  renderHistoryRows();
}

function renderHistoryRows() {
  const q = ($('search')?.value || '').toLowerCase();
  let arr = reviews.filter(r => r.title.toLowerCase().includes(q) || String(r.id).includes(q));
  if (historyFilter !== 'all') {
    arr = arr.filter(r => r.status === historyFilter);
  }
  const el = $('historyrows');
  if (!el) return;
  if (!arr.length) {
    el.innerHTML = emptyState('No matching reviews', 'Try modifying your search or filter criteria.');
    return;
  }
  el.innerHTML = arr.map(r => `
    <button class="list-row" onclick="openReview(${r.id})">
      <div class="list-row-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      </div>
      <div class="list-row-content">
        <b>${esc(r.title)}</b>
        <small>Review #${r.id} · ${new Date(r.created_at).toLocaleString()} · ${r.findings.length} findings</small>
      </div>
      ${statusPill(r.status)}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  `).join('');
}

          </div>
        </div>

        ${(() => {
          const counts = {};
          reviews.forEach(r => r.findings.forEach(f => {
            counts[f.rule_title] = (counts[f.rule_title] || 0) + 1;
          }));
          const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
          const maxCount = entries.length ? entries[0][1] : 1;
          return entries.length ? entries.map(([name, count]) => `
            <div style="margin-bottom:14px">
              <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:5px">
                <b>${esc(name)}</b>
                <span style="font:10px 'DM Mono'; color:var(--teal)">${count} triggers</span>
              </div>
              <div style="height:6px; background:rgba(255,255,255,0.05); border-radius:10px; overflow:hidden">
                <div style="height:100%; width:${Math.round((count/maxCount)*100)}%; background:linear-gradient(90deg, var(--teal), var(--violet)); border-radius:10px"></div>
              </div>
            </div>
          `).join('') : emptyState('No insights available yet', 'Run reviews to start compiling governance rule insights.')
        })()}
      </section>
    `;
  }

  $('content').innerHTML = c;
  if (page === 'Review History') {
    renderHistoryRows();
  }
}

// Initial synchronous render so page is NEVER blank
render();
// Fetch live data
refresh().then(() => {
  const urlParams = new URLSearchParams(window.location.search);
  const autoReportId = urlParams.get('report') || urlParams.get('printReport');
  if (autoReportId) {
    viewComplianceReport(autoReportId);
  }
});
</script>
</body>
</html>
